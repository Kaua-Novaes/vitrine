spring.application.name=vitrine-backend-prod

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/vitrine_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Storage
storage.local.base-dir=${STORAGE_BASE_DIR:/storage/tenants}

# JWT
jwt.secret=${JWT_SECRET:vitrine-super-secret-key-that-is-at-least-256-bits-long-and-secure-for-hmac-sha256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
