spring.application.name=vitrine-backend-dev

# Local file-based H2 database (Zero Docker / Zero setup required)
spring.datasource.url=jdbc:h2:file:./data/vitrinedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Storage
storage.local.base-dir=./storage/tenants

# JWT Security
jwt.secret=vitrine-super-secret-key-that-is-at-least-256-bits-long-and-secure-for-hmac-sha256
jwt.expiration-ms=86400000
