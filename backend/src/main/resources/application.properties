spring.application.name=vitrine-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vitrine_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Storage
storage.local.base-dir=${STORAGE_BASE_DIR:/storage/tenants}

# JWT Security
jwt.secret=${JWT_SECRET:vitrine-super-secret-key-that-is-at-least-256-bits-long-and-secure-for-hmac-sha256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Jackson Deserialization
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false
