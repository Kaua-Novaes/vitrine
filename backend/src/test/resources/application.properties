spring.application.name=vitrine-backend-test

# Test Database (H2 PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway disabled for test environment (H2 schema generated via ddl-auto)
spring.flyway.enabled=false

# Test Storage
storage.local.base-dir=target/test-storage

# JWT Security
jwt.secret=vitrine-super-secret-key-that-is-at-least-256-bits-long-and-secure-for-hmac-sha256
jwt.expiration-ms=86400000
