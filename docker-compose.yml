services:
  postgres:
    image: postgres:16-alpine
    container_name: vitrine-postgres
    environment:
      POSTGRES_DB: vitrine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitrine-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vitrine_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: vitrine-super-secret-key-that-is-at-least-256-bits-long-and-secure-for-hmac-sha256
      STORAGE_BASE_DIR: /storage/tenants
    ports:
      - "8080:8080"
    volumes:
      - vitrine_storage:/storage/tenants
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  vitrine_storage:
